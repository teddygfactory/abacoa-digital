<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc">
  <title id="title">Abacoa Digital — a call becomes a customer record</title>
  <desc id="desc">Illustrative workspace with sample data. An incoming call is answered by the AI assistant, Maya's urgent AC request is saved in the CRM with a 3 PM appointment, and a brief is ready for the owner to review and assign to the team.</desc>
  <defs>
    <linearGradient id="frame" x2="1" y2="1"><stop stop-color="#272d30"/><stop offset="1" stop-color="#11171b"/></linearGradient>
    <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#f1d68c"/><stop offset="1" stop-color="#c49b46"/></linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".24"/></filter>
    <g id="check"><circle r="10" fill="#d5bc78"/><path d="m-4 0 3 3 5-6" fill="none" stroke="#20262a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <rect width="1040" height="700" rx="22" fill="#0e1316"/>
  <rect width="1040" height="700" rx="22" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="24" y="24" width="992" height="652" rx="16" fill="url(#frame)" stroke="#48504f" filter="url(#shadow)"/>
    <path d="M24 96h992" stroke="#414847"/>
    <rect x="46" y="43" width="38" height="34" rx="10" fill="url(#gold)"/>
    <text x="65" y="68" fill="#1a2428" font-family="Georgia, serif" font-weight="bold" font-size="27" text-anchor="middle">a.</text>
    <text x="98" y="67" fill="#f5eddb" font-size="23" font-weight="bold">Abacoa Digital</text>
    <text x="745" y="66" fill="#c4c5bc" font-size="18">Customer operations</text>
    <circle cx="970" cy="60" r="17" fill="#3b4548"/>
    <path d="M962 67c1-7 15-7 16 0m-4-12a4 4 0 1 1-8 0 4 4 0 0 1 8 0" fill="none" stroke="#e7e6d9" stroke-width="1.7" stroke-linecap="round"/>
    <text x="52" y="133" fill="#e9d396" font-size="18" letter-spacing="1.4">ONE CALL. EVERYTHING CONNECTED.</text>
    <text x="52" y="169" fill="#f6f0e1" font-size="29">Your next customer, already organised.</text>

    <!-- A connected, completed intake with a human decision at the end. -->
    <path d="M200 235h650" fill="none" stroke="#bb9d58" stroke-width="2" stroke-dasharray="5 6"/>
    <g fill="#20292d" stroke="#5a5d4c"><rect x="52" y="194" width="216" height="88" rx="11"/><rect x="292" y="194" width="216" height="88" rx="11"/><rect x="532" y="194" width="216" height="88" rx="11"/></g>
    <rect x="772" y="194" width="216" height="88" rx="11" fill="#38372b" stroke="#d5bc78"/>
    <g font-size="18" fill="#afb9b8"><text x="72" y="222">01 · PHONE</text><text x="312" y="222">02 · AI ASSISTANT</text><text x="552" y="222">03 · CRM</text><text x="792" y="222" fill="#ead39c">04 · YOUR TEAM</text></g>
    <g font-size="22" fill="#f3eddf"><text x="72" y="258">Call received</text><text x="312" y="258">Details captured</text><text x="552" y="258">Lead organised</text><text x="792" y="258">Ready for review</text></g>
    <use href="#check" x="249" y="213"/><use href="#check" x="489" y="213"/><use href="#check" x="729" y="213"/>

    <!-- Customer information is concrete, legible and intentionally fictional. -->
    <rect x="52" y="310" width="552" height="296" rx="13" fill="#f3eddf"/>
    <text x="76" y="344" fill="#6d695b" font-size="18" letter-spacing="1">CUSTOMER RECORD</text>
    <circle cx="98" cy="389" r="23" fill="#d8c899"/>
    <text x="98" y="397" text-anchor="middle" fill="#534527" font-size="24">M</text>
    <text x="135" y="386" fill="#252e31" font-size="29" font-weight="bold">Maya</text>
    <text x="136" y="412" fill="#64695f" font-size="18">Jupiter · Home services</text>
    <rect x="457" y="366" width="123" height="33" rx="16" fill="#ead7b6"/>
    <text x="518" y="389" text-anchor="middle" fill="#774c25" font-size="18">Urgent</text>
    <path d="M76 433h504" stroke="#d6d0c3"/>
    <text x="76" y="464" fill="#727367" font-size="18">REQUEST</text><text x="270" y="464" fill="#253236" font-size="21">AC not cooling</text>
    <text x="76" y="499" fill="#727367" font-size="18">APPOINTMENT</text><text x="270" y="499" fill="#253236" font-size="21">Today · 3:00 PM</text>
    <text x="76" y="534" fill="#727367" font-size="18">STATUS</text><text x="270" y="534" fill="#253236" font-size="21">Booked · Assign crew</text>
    <rect x="76" y="553" width="504" height="32" rx="6" fill="#e8e3d4"/>
    <text x="92" y="576" fill="#5c6253" font-size="18">Phone → Conversation → Appointment</text>

    <rect x="624" y="310" width="364" height="296" rx="13" fill="#1b2529" stroke="#47514c"/>
    <circle cx="651" cy="340" r="4" fill="#d5bc78"/>
    <text x="665" y="347" fill="#dcca93" font-size="18">AI HANDOFF BRIEF</text>
    <text x="648" y="387" fill="#f3eddf" font-size="23">The context comes with it.</text>
    <g fill="#bbc7c7" font-size="21"><text x="648" y="427">No cooling. Children at home.</text><text x="648" y="460">3 PM accepted by customer.</text><text x="648" y="493">Urgency flagged for the owner.</text></g>
    <rect x="648" y="532" width="316" height="48" rx="8" fill="url(#gold)"/>
    <text x="672" y="563" fill="#253033" font-size="21" font-weight="bold">Review &amp; assign</text>
    <path d="m938 551 6 6-6 6m-6-6h11" fill="none" stroke="#253033" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="646" fill="#c8cfca" font-size="19">The routine work connects. You take care of the customer.</text>
    <text x="987" y="646" fill="#a5afab" font-size="17" text-anchor="end">Illustrative workspace · Sample data</text>
  </g>
</svg>
